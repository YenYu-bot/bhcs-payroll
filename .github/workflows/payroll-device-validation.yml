name: Payroll synthetic device-copy validation
on:
  push:
    branches: [test/payroll-v3-isolated-20261112]
    paths: ['tests/payroll-device/**', '.github/workflows/payroll-device-validation.yml']
permissions:
  contents: read
concurrency:
  group: payroll-device-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chromium-device:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify inputs and prepare browser only
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/tests/payroll-v3-isolated"
          M="$GITHUB_WORKSPACE/tests/payroll-device"
          mkdir -p "$M/evidence"
          (cd "$P" && sha256sum -c INPUTS.sha256) | tee "$M/evidence/inputs.txt"
          (cd "$M" && sha256sum -c MANIFEST.sha256) | tee "$M/evidence/test-inputs.txt"
          python3 -m venv "$RUNNER_TEMP/payroll-venv"
          "$RUNNER_TEMP/payroll-venv/bin/pip" install 'playwright==1.56.0'
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/payroll-browsers" "$RUNNER_TEMP/payroll-venv/bin/python" -m playwright install --with-deps chromium
      - name: Sandboxed browser and synthetic migration without external network
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/tests/payroll-v3-isolated"
          M="$GITHUB_WORKSPACE/tests/payroll-device"
          mkdir -p "$RUNNER_TEMP/payroll-device-home"
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env -i \
              HOME="$2/payroll-device-home" \
              PATH="$2/payroll-venv/bin:/usr/local/bin:/usr/bin:/bin" \
              PLAYWRIGHT_BROWSERS_PATH="$2/payroll-browsers" \
              LANG=C.UTF-8 CI=true \
              bash "$4/isolated_device.sh" "$3" "$4"
          ' _ "$(id -un)" "$RUNNER_TEMP" "$P" "$M"
      - name: Retain only synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: payroll-device-${{ github.sha }}
          path: tests/payroll-device/evidence/
          retention-days: 14
          if-no-files-found: warn
